<svg xmlns="http://www.w3.org/2000/svg" width="768" height="469.333333" viewBox="0 0 900 550" role="img" aria-labelledby="title desc" lang="vi">
<title id="title">Tỷ lệ tổng có trọng số theo mẫu số</title>
<desc id="desc">Packet DEMO, kỳ 2026-11, đơn vị points. DEMO-X đạt 45 trên 50, bằng 90 phần trăm; DEMO-Y đạt 30 trên 60, bằng 50 phần trăm. Tổng đạt 75 trên 110, xấp xỉ 68.18 phần trăm. Ba thanh dùng cùng thang từ 0 đến 100 phần trăm; nhãn và họa tiết bổ sung màu.</desc>
<defs>
<pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="white" stroke-width="2"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.5" fill="white"/></pattern>
</defs>
<rect width="900" height="550" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#172b4d">
<text x="36" y="43" font-size="28" font-weight="700">Tỷ lệ tổng được tính theo mẫu số</text>
<text x="36" y="73" font-size="17">PUBLIC_SYNTHETIC • Đào tạo ratio-weighting • Kỳ 2026-11</text>
<text x="220" y="106" font-size="16">Tỷ lệ (%) • cùng thang 0–100</text>
<g stroke="#cbd5e1" stroke-width="1"><path d="M220 144V358M360 144V358M500 144V358M640 144V358M780 144V358"/></g>
<g font-size="15" text-anchor="middle"><text x="220" y="132">0</text><text x="360" y="132">25</text><text x="500" y="132">50</text><text x="640" y="132">75</text><text x="780" y="132">100</text></g>
<g fill="#edf2f7"><rect x="220" y="160" width="560" height="28"/><rect x="220" y="240" width="560" height="28"/><rect x="220" y="320" width="560" height="28"/></g>
<rect x="220" y="160" width="504" height="28" fill="#205493"/>
<rect x="220" y="240" width="280" height="28" fill="#146356"/><rect x="220" y="240" width="280" height="28" fill="url(#stripes)"/>
<rect x="220" y="320" width="381.8182" height="28" fill="#563d7c"/><rect x="220" y="320" width="381.8182" height="28" fill="url(#dots)"/>
<g font-size="19" font-weight="700"><text x="36" y="178">DEMO-X</text><text x="36" y="258">DEMO-Y</text><text x="36" y="338">TỔNG</text></g>
<g font-size="16"><text x="36" y="202">45/50 points</text><text x="36" y="282">30/60 points</text><text x="36" y="362">75/110 points</text></g>
<g font-size="18" font-weight="700"><text x="796" y="180">90%</text><text x="796" y="260">50%</text><text x="796" y="340">68.18%</text></g>
<rect x="36" y="390" width="828" height="103" rx="10" fill="#edf2f7"/>
<text x="54" y="417" font-size="20" font-weight="700">Tổng = (45 + 30) / (50 + 60) × 100 ≈ 68.18%</text>
<text x="54" y="446" font-size="18">Tương đương: (90% × 50 + 50% × 60) / 110 ≈ 68.18%</text>
<text x="54" y="475" font-size="17">Mẫu số 50 và 60 là trọng số; không lấy trung bình đơn giản.</text>
<text x="36" y="524" font-size="15">Nguồn: packet DEMO • Đơn vị: points • Kỳ: 2026-11 • Tổng làm tròn 2 chữ số</text>
</g>
</svg>
